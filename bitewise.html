<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitewise — Fast Food, Elevated</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #0c0d0e;
    --bg-card: rgba(255, 255, 255, 0.03);
    --bg-card-hover: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.08);
    --border-accent: rgba(245, 158, 11, 0.3);
    
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    
    --accent: #f59e0b;
    --accent-hover: #d97706;
    --accent-glow: rgba(245, 158, 11, 0.25);
    
    --max: 1240px;
    --radius-lg: 24px;
    --radius-md: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 100px; }
  body {
    background: var(--bg-main);
    color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  a { text-decoration: none; color: inherit; }
  img { max-width: 100%; display: block; }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 32px; }
  @media(max-width: 640px) { .wrap { padding: 0 20px; } }

  .reveal { opacity: 0; transform: translateY(30px); transition: opacity .8s cubic-bezier(0.16, 1, 0.3, 1), transform .8s cubic-bezier(0.16, 1, 0.3, 1); }
  .reveal.in { opacity: 1; transform: translateY(0); }

  /* HEADER & NAV */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(12, 13, 14, 0.8);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  nav.wrap { display: flex; align-items: center; justify-content: space-between; height: 80px; }
  .logo { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
  .logo span { color: var(--accent); }
  
  .navlinks { display: flex; gap: 32px; font-weight: 600; font-size: 14px; }
  .navlinks a { color: var(--text-secondary); transition: color .2s; }
  .navlinks a:hover { color: var(--text-primary); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    padding: 12px 26px; border-radius: 99px; font-weight: 700; font-size: 14px;
    cursor: pointer; border: 1px solid transparent; transition: all .3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .btn-accent {
    background: var(--accent); color: #000;
    box-shadow: 0 0 20px var(--accent-glow);
  }
  .btn-accent:hover {
    background: var(--accent-hover);
    transform: translateY(-2px);
    box-shadow: 0 4px 25px var(--accent-glow);
  }
  .btn-glass {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-primary);
  }
  .btn-glass:hover {
    background: var(--bg-card-hover);
    border-color: rgba(255, 255, 255, 0.2);
    transform: translateY(-2px);
  }

  .burger { display: none; flex-direction: column; gap: 6px; cursor: pointer; z-index: 200; }
  .burger span { width: 22px; height: 2px; background: var(--text-primary); transition: .3s; }

  /* HERO */
  .hero { padding: 80px 0 40px; position: relative; overflow: hidden; }
  .hero-glow {
    position: absolute; top: -150px; left: 50%; transform: translateX(-50%);
    width: 700px; height: 700px; background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
    pointer-events: none; opacity: 0.8;
  }
  .hero-content { text-align: center; position: relative; z-index: 2; max-width: 780px; margin: 0 auto; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px;
    background: rgba(245, 158, 11, 0.1); border: 1px solid var(--border-accent);
    border-radius: 99px; font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 24px;
  }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  
  .hero-title { font-size: clamp(42px, 7vw, 72px); font-weight: 800; line-height: 1.05; letter-spacing: -2px; }
  .hero-title span { color: var(--accent); }
  .hero-desc { font-size: 18px; color: var(--text-secondary); margin: 20px auto 32px; max-width: 540px; line-height: 1.6; }
  
  .hero-actions { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-bottom: 40px; }

  /* 3D CIRCULAR CAROUSEL ANIMATION */
  .circle-carousel-container {
    position: relative;
    width: 100%;
    height: 420px;
    margin-top: 10px;
    perspective: 1000px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .circle-carousel {
    position: relative;
    width: 220px;
    height: 290px;
    transform-style: preserve-3d;
    transition: transform 0.1s linear;
  }

  .circle-card {
    position: absolute;
    width: 100%;
    height: 100%;
    left: 0;
    top: 0;
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 2px solid var(--border);
    box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    background: rgba(20, 20, 22, 0.9);
    backdrop-filter: blur(10px);
    transition: border-color 0.3s, box-shadow 0.3s;
    user-select: none;
  }

  .circle-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }

  .circle-card:hover {
    border-color: var(--accent);
    box-shadow: 0 0 25px var(--accent-glow);
  }

  .circle-controls {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 20px;
    position: relative;
    z-index: 10;
  }

  .circle-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    transition: all 0.3s;
  }

  .circle-btn:hover {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }

  /* SECTIONS */
  .section { padding: 100px 0; border-top: 1px solid var(--border); }
  .section-head { max-width: 580px; margin-bottom: 48px; }
  .kicker { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); display: block; margin-bottom: 12px; }
  .section-head h2 { font-size: clamp(32px, 4.5vw, 48px); font-weight: 800; letter-spacing: -1px; }

  /* MENU FILTER */
  .tabs { display: flex; gap: 8px; margin-bottom: 40px; flex-wrap: wrap; }
  .tab {
    padding: 10px 22px; border-radius: 99px; border: 1px solid var(--border);
    background: var(--bg-card); color: var(--text-secondary); font-weight: 600; font-size: 14px;
    cursor: pointer; transition: all .3s;
  }
  .tab.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }

  .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  @media(max-width: 960px) { .menu-grid { grid-template-columns: repeat(2, 1fr); } }
  @media(max-width: 640px) { .menu-grid { grid-template-columns: 1fr; } }

  .item {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 20px; transition: all .3s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column;
  }
  .item:hover {
    transform: translateY(-6px);
    border-color: rgba(255, 255, 255, 0.2);
    background: var(--bg-card-hover);
  }
  .item .img-wrap { border-radius: var(--radius-md); overflow: hidden; aspect-ratio: 4/3; margin-bottom: 20px; }
  .item .img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .item-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .item h3 { font-size: 18px; font-weight: 700; }
  .item .price { font-weight: 800; font-size: 16px; color: var(--accent); }
  .item p { font-size: 14px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 20px; flex-grow: 1; }

  /* FOOTER */
  footer { padding: 60px 0 40px; border-top: 1px solid var(--border); text-align: center; color: var(--text-muted); font-size: 14px; }
</style>
</head>
<body>

<header>
  <nav class="wrap">
    <a href="#" class="logo">Bite<span>wise</span></a>
    <div class="navlinks">
      <a href="#menu">Menu</a>
      <a href="#about">Story</a>
      <a href="#contact">Locations</a>
    </div>
    <a href="#menu" class="btn btn-accent">Order Now</a>
    <div class="burger" id="burger"><span></span><span></span><span></span></div>
  </nav>
</header>

<!-- HERO WITH CIRCULAR ROTATING CAROUSEL -->
<section class="hero">
  <div class="hero-glow"></div>
  <div class="wrap">
    <div class="hero-content reveal in">
      <div class="badge"><span class="badge-dot"></span> Craft Fast Casual</div>
      <h1 class="hero-title">Savor Every <span>Delicious</span> Bite.</h1>
      <p class="hero-desc">Hand-pressed smash patties, golden triple-cooked fries, and artisanal brioche baked daily.</p>
      <div class="hero-actions">
        <a href="#menu" class="btn btn-accent">Explore Menu</a>
        <a href="#about" class="btn btn-glass">Our Story</a>
      </div>
    </div>

    <!-- CIRCULAR 3D ROTATING GALLERY -->
    <div class="circle-carousel-container reveal in" id="carouselContainer">
      <div class="circle-carousel" id="circleCarousel">
        <div class="circle-card"><img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=600&auto=format&fit=crop" alt="Burger"></div>
        <div class="circle-card"><img src="https://images.unsplash.com/photo-1573080496219-bb080dd4f877?q=80&w=500&auto=format&fit=crop" alt="Fries"></div>
        <div class="circle-card"><img src="https://images.unsplash.com/photo-1550547660-d9450f859349?q=80&w=500&auto=format&fit=crop" alt="Sandwich"></div>
        <div class="circle-card"><img src="https://images.unsplash.com/photo-1585109649139-366815a0d713?q=80&w=500&auto=format&fit=crop" alt="Onion Rings"></div>
        <div class="circle-card"><img src="https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?q=80&w=500&auto=format&fit=crop" alt="Loaded Fries"></div>
        <div class="circle-card"><img src="https://images.unsplash.com/photo-1571091718767-18b5b1457add?q=80&w=600&auto=format&fit=crop" alt="Double Smash"></div>
      </div>
    </div>

    <div class="circle-controls">
      <button class="circle-btn" id="prevBtn">‹</button>
      <button class="circle-btn" id="nextBtn">›</button>
    </div>
  </div>
</section>

<!-- MENU -->
<section class="section" id="menu">
  <div class="wrap">
    <div class="section-head reveal">
      <span class="kicker">Crafted To Order</span>
      <h2>Fan Favorites</h2>
    </div>
    <div class="tabs reveal">
      <button class="tab active" data-filter="all">All Items</button>
      <button class="tab" data-filter="burgers">Burgers</button>
      <button class="tab" data-filter="sides">Sides</button>
      <button class="tab" data-filter="drinks">Drinks</button>
    </div>
    <div class="menu-grid" id="menuGrid"></div>
  </div>
</section>

<footer>
  <div class="wrap">
    <p>© 2026 Bitewise. All rights reserved.</p>
  </div>
</footer>

<script>
// Reveal Animation on scroll
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => { if(e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
}, { threshold: 0.1 });
document.querySelectorAll('.reveal').forEach(el => io.observe(el));

// 3D CIRCULAR CAROUSEL LOGIC
const carousel = document.getElementById('circleCarousel');
const cards = document.querySelectorAll('.circle-card');
const container = document.getElementById('carouselContainer');
const totalCards = cards.length;
const radius = 320; // Radius of circular orbit
let currAngle = 0;
let isHovered = false;

// Position cards around 360 degrees circle
function setupCarousel() {
  cards.forEach((card, i) => {
    const angle = (i * (360 / totalCards));
    card.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;
  });
}

function updateRotation() {
  carousel.style.transform = `rotateY(${currAngle}deg)`;
}

// Auto-spin animation loop
function autoSpin() {
  if (!isHovered) {
    currAngle -= 0.35; // Speed of spin
    updateRotation();
  }
  requestAnimationFrame(autoSpin);
}

// Pause rotation on hover
container.addEventListener('mouseenter', () => isHovered = true);
container.addEventListener('mouseleave', () => isHovered = false);

// Controls
document.getElementById('prevBtn').addEventListener('click', () => {
  currAngle += (360 / totalCards);
  updateRotation();
});
document.getElementById('nextBtn').addEventListener('click', () => {
  currAngle -= (360 / totalCards);
  updateRotation();
});

setupCarousel();
autoSpin();

// MENU RENDER
const items = [
  {name:"Classic Cheeseburger", price:"$7.00", cat:"burgers", img:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=700&auto=format&fit=crop", desc:"Hand-pressed beef patty, aged cheddar, dill pickles, signature sauce."},
  {name:"Double Smash", price:"$9.50", cat:"burgers", img:"https://images.unsplash.com/photo-1571091718767-18b5b1457add?q=80&w=700&auto=format&fit=crop", desc:"Dual crispy smashed patties, caramelized onions, American cheese."},
  {name:"Spicy Honey Chicken", price:"$8.00", cat:"burgers", img:"https://images.unsplash.com/photo-1550547660-d9450f859349?q=80&w=700&auto=format&fit=crop", desc:"Buttermilk fried chicken, house hot honey glaze, crunchy cabbage slaw."},
  {name:"Triple-Cooked Fries", price:"$4.00", cat:"sides", img:"https://images.unsplash.com/photo-1573080496219-bb080dd4f877?q=80&w=700&auto=format&fit=crop", desc:"Hand-cut sea salt fries, crispy on the outside, fluffy inside."},
  {name:"Loaded Truffle Fries", price:"$6.50", cat:"sides", img:"https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?q=80&w=700&auto=format&fit=crop", desc:"Truffle oil, grated parmesan, scallions, roasted garlic aioli."},
  {name:"Vanilla Shake", price:"$5.50", cat:"drinks", img:"https://images.unsplash.com/photo-1541658016709-82535e94bc69?q=80&w=700&auto=format&fit=crop", desc:"Madagascar vanilla bean cream, topped with fresh whip."}
];

const grid = document.getElementById('menuGrid');
function renderMenu(filter) {
  grid.innerHTML = '';
  items.filter(d => filter === 'all' || d.cat === filter).forEach((d, i) => {
    const el = document.createElement('div');
    el.className = 'item reveal';
    el.innerHTML = `
      <div class="img-wrap"><img src="${d.img}" alt="${d.name}"></div>
      <div class="item-top">
        <h3>${d.name}</h3>
        <span class="price">${d.price}</span>
      </div>
      <p>${d.desc}</p>
      <button class="btn btn-glass" style="width:100%; font-size:13px; padding:10px;">Add to Order</button>
    `;
    grid.appendChild(el);
    io.observe(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
  });
}
renderMenu('all');

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    renderMenu(tab.dataset.filter);
  });
});
</script>
</body>
</html>
